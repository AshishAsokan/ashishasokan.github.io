- id: distribution-shift
  title: "Distribution Shift"
  tagline: "Building robust models across distribution boundaries"
  body: "Models that perform well in-distribution frequently degrade when deployed under domain shift. My prior work addresses this through transformer-based methods for source-free domain adaptation, vision-language supervision for cross-domain generalization, and training strategies for long-tail visual recognition."
