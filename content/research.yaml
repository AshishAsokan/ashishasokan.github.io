- id: distillation
  title: "Distillation"
  tagline: "Transferring frontier capability into accessible models"
  body: "State-of-the-art models offer remarkable capabilities, but their deployment is constrained by computational cost and API-only access. I study how much of a frontier model's capability can be recovered through distillation — examining the data regimes, query strategies, and training objectives that make knowledge transfer most effective."
  links_label: "Selected work"
  links:
    - title: "VL2V-ADiP"
      meta: "CVPR 2024"
      url: "https://arxiv.org/abs/2310.08255"
    - title: "Distilling from VLMs for OOD Generalization"
      meta: "CVPRW 2023"
      url: "https://arxiv.org/pdf/2310.08255"

- id: diffing
  title: "Model Diffing"
  tagline: "Characterizing behavioral change across model versions"
  body: "Benchmark scores provide an incomplete account of how models change across training runs or releases. I am developing systematic tools for model comparison — frameworks that surface meaningful behavioral differences, track capability shifts, and assess compatibility across a model family over time."
  links_label: "Related prior work"
  links:
    - title: "StringSight"
